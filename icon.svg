<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1519"/>
      <stop offset="50%" stop-color="#0F282F"/>
      <stop offset="100%" stop-color="#006D77"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background with Rounded Corners -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Outer Ring / Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#tealGrad)" stroke-width="8" opacity="0.4"/>
  <circle cx="256" cy="256" r="195" fill="#0A181C" stroke="url(#tealGrad)" stroke-width="4"/>
  
  <!-- Sparkles -->
  <path d="M 360 140 Q 360 170 390 170 Q 360 170 360 200 Q 360 170 330 170 Q 360 170 360 140 Z" fill="#00F5D4" filter="url(#glow)"/>
  <path d="M 150 160 Q 150 180 170 180 Q 150 180 150 200 Q 150 180 130 180 Q 150 180 150 160 Z" fill="#90E0EF"/>
  <path d="M 370 330 Q 370 345 385 345 Q 370 345 370 360 Q 370 345 355 345 Q 370 345 370 330 Z" fill="#00F5D4"/>

  <!-- Broom / Wand & Spray Icon Graphic -->
  <g transform="translate(136, 140) scale(0.95)">
    <!-- Spray Bottle -->
    <path d="M 60 130 C 60 110 75 95 95 95 L 125 95 L 125 70 L 95 70 C 85 70 80 60 85 50 L 95 30 C 100 20 110 15 125 15 L 155 15 C 165 15 175 25 175 35 L 175 95 L 185 95 C 205 95 220 110 220 130 L 230 230 C 230 255 210 275 185 275 L 95 275 C 70 275 50 255 50 230 Z" fill="url(#tealGrad)" opacity="0.95"/>
    <!-- Liquid Level Accent -->
    <path d="M 52 200 C 70 190 110 215 150 205 C 190 195 215 210 228 200 L 230 230 C 230 255 210 275 185 275 L 95 275 C 70 275 50 255 50 230 Z" fill="#00F5D4" opacity="0.8"/>
    <!-- Bottle Nozzle -->
    <rect x="70" y="35" width="40" height="15" rx="5" fill="#E2F1F8"/>
    <!-- Spray Mist / Droplets -->
    <circle cx="40" cy="35" r="7" fill="#90E0EF"/>
    <circle cx="20" cy="25" r="5" fill="#90E0EF"/>
    <circle cx="15" cy="50" r="6" fill="#00F5D4"/>
    <circle cx="35" cy="65" r="4" fill="#90E0EF"/>
  </g>
</svg>
